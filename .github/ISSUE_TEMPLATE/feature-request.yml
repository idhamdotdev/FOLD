name: Feature request
description: Suggest a practical improvement to FOLD.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user problem and when it occurs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workaround or alternative you already tried.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: I understand that a request is not a promise of implementation or a release date.
          required: true
